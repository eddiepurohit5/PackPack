plugins { id 'com.android.application' }
android {
 if (rootProject.file('debug.keystore').exists()) signingConfigs { debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 namespace 'com.packproof.app'
 compileSdk 37
 defaultConfig { applicationId 'com.packproof.app'; minSdk 26; targetSdk 37; versionCode 1; versionName '1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
